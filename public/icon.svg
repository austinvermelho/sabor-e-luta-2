<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="#b91c1c"/>
  
  <!-- Subtle inner border framing -->
  <rect x="24" y="24" width="464" height="464" rx="72" fill="none" stroke="#fcfbf7" stroke-width="8" opacity="0.35"/>

  <!-- Stacked Typographic Branding: SABOR & LUTA (No star) -->
  <g text-anchor="middle" font-family="'Oswald', 'Plus Jakarta Sans', sans-serif" font-weight="700" fill="#fcfbf7">
    <!-- SABOR -->
    <text x="256" y="190" font-size="110" letter-spacing="8">SABOR</text>
    
    <!-- Ampersand with side lines -->
    <text x="256" y="295" font-size="80" fill="#fef08a" font-weight="800">&amp;</text>
    <line x1="120" y1="285" x2="200" y2="285" stroke="#fef08a" stroke-width="8" stroke-linecap="round"/>
    <line x1="312" y1="285" x2="392" y2="285" stroke="#fef08a" stroke-width="8" stroke-linecap="round"/>
    
    <!-- LUTA -->
    <text x="256" y="415" font-size="120" letter-spacing="12">LUTA</text>
  </g>
</svg>
